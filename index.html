<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Coffee Roaster Timer</title>
  <!-- Chart.js and Annotation Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.1.0"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; }
    button { padding: 12px 18px; font-size: 1rem; margin-right: 5px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; background: #f0f0f0; cursor: pointer; }
    button:active { background: #e0e0e0; }
    #timer { font-size: 3rem; font-weight: bold; margin: 15px 0; font-variant-numeric: tabular-nums; }
    #status { color: #333; font-weight: 500; min-height: 24px; }
    #wakelock-status { font-size: 0.85rem; color: #2e7d32; font-weight: 500; margin-bottom: 10px; }
    .event-badge { display: inline-block; background: #d32f2f; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; margin-top: 5px; }
    #chart-container { margin-top: 30px; }
  </style>
</head>
<body>

  <h1>Coffee Roast Voice Timer</h1>
  <div id="timer">00:00</div>
  <div id="wakelock-status">Screen Stay-Awake: Inactive</div>
  
  <div>
    <button id="startBtn">Start Roast</button>
    <button id="listenBtn">🎤 Say Voice Command</button>
    <button id="stopBtn">Stop & Render Chart</button>
  </div>
  
  <p id="status">Status: Idle</p>
  <div id="events-log"></div>

  <div id="chart-container">
    <canvas id="roastChart"></canvas>
  </div>

<script>
  let secondsElapsed = 0;
  let timerInterval = null;
  let voiceInterval = null;
  let wakeLock = null;
  
  const timestamps = [];
  const temperatures = [];
  let firstCrackTime = null; // Stores timestamp string of First Crack

  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const wakeStatusEl = document.getElementById('wakelock-status');
  const eventsLogEl = document.getElementById('events-log');
  
  // Speech Recognition Setup
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synthesis = window.speechSynthesis;
  let recognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.toLowerCase();
      statusEl.textContent = `Heard: "${transcript}"`;
      
      // 1. Check for "First Crack" keywords
      if (transcript.includes('first crack') || transcript.includes('crack') || transcript.includes('fc')) {
        firstCrackTime = formatTime(secondsElapsed);
        eventsLogEl.innerHTML += `<div class="event-badge">🔥 First Crack at ${firstCrackTime}</div>`;
        statusEl.textContent = `Logged First Crack at ${firstCrackTime}!`;
        return;
      }

      // 2. Otherwise parse temperature digits
      const matches = transcript.match(/\d+/g);
      if (matches) {
        const temp = parseInt(matches.join(''), 10);
        logDataPoint(secondsElapsed, temp);
      } else {
        statusEl.textContent = `Could not recognize command from: "${transcript}"`;
      }
    };

    recognition.onerror = (e) => {
      statusEl.textContent = `Speech recognition error: ${e.error}`;
    };
  } else {
    alert("Web Speech API is not supported in this browser. Use Safari on iOS.");
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeStatusEl.textContent = "Screen Stay-Awake: Active 🔒";
      }
    } catch (err) {
      wakeStatusEl.textContent = `Wake Lock Error: ${err.message}`;
    }
  }

  function startListening() {
    statusEl.textContent = "Listening for prompt or 'First Crack'...";
    try { recognition.start(); } catch(e) {}
  }

  function speakPrompt() {
    if (!synthesis) return;
    const utterance = new SpeechSynthesisUtterance("What is the temperature?");
    utterance.onend = () => { startListening(); };
    synthesis.speak(utterance);
  }

  function formatTime(sec) {
    const mins = Math.floor(sec / 60).toString().padStart(2, '0');
    const secs = (sec % 60).toString().padStart(2, '0');
    return `${mins}:${secs}`;
  }

  function logDataPoint(sec, temp) {
    timestamps.push(formatTime(sec));
    temperatures.push(temp);
    statusEl.textContent = `Logged ${temp}° at ${formatTime(sec)}`;
  }

  document.getElementById('listenBtn').addEventListener('click', () => {
    startListening();
  });

  document.getElementById('startBtn').addEventListener('click', async () => {
    secondsElapsed = 0;
    timestamps.length = 0;
    temperatures.length = 0;
    firstCrackTime = null;
    eventsLogEl.innerHTML = '';

    await requestWakeLock();

    if (synthesis) {
      const unlockSpeech = new SpeechSynthesisUtterance("");
      synthesis.speak(unlockSpeech);
    }
    
    timerInterval = setInterval(() => {
      secondsElapsed++;
      timerEl.textContent = formatTime(secondsElapsed);
    }, 1000);

    speakPrompt();
    voiceInterval = setInterval(() => {
      speakPrompt();
    }, 30000);

    statusEl.textContent = "Roast started...";
  });

  document.getElementById('stopBtn').addEventListener('click', async () => {
    clearInterval(timerInterval);
    clearInterval(voiceInterval);
    if (synthesis) synthesis.cancel();
    
    if (wakeLock !== null) {
      await wakeLock.release();
      wakeStatusEl.textContent = "Screen Stay-Awake: Released";
    }

    statusEl.textContent = "Roast ended. Rendering chart...";
    renderChart();
  });

  function renderChart() {
    const ctx = document.getElementById('roastChart').getContext('2d');
    
    // Configure vertical line annotation if First Crack was logged
    const annotationsConfig = {};
    if (firstCrackTime) {
      annotationsConfig.firstCrackLine = {
        type: 'line',
        xMin: firstCrackTime,
        xMax: firstCrackTime,
        borderColor: '#d32f2f',
        borderWidth: 2,
        borderDash: [6, 6],
        label: {
          display: true,
          content: 'First Crack',
          position: 'start',
          backgroundColor: '#d32f2f',
          color: 'white'
        }
      };
    }

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: timestamps,
        datasets: [{
          label: 'Bean Temperature (°)',
          data: temperatures,
          borderColor: '#8B4513',
          backgroundColor: 'rgba(139, 69, 19, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        plugins: {
          annotation: {
            annotations: annotationsConfig
          }
        },
        scales: {
          x: { title: { display: true, text: 'Time (MM:SS)' } },
          y: { title: { display: true, text: 'Temperature' } }
        }
      }
    });
  }
</script>
</body>
</html>
